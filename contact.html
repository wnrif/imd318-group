                            <input type="text" class="mail_text" placeholder="Your Phone" id="yourPhone">

    <script>
        function sendMessage() {
            var name = document.getElementById('yourName').value;
            var email = document.getElementById('yourEmail').value;
            var phone = document.getElementById('yourPhone').value;
            var message = document.getElementById('message').value;

            // Simple validation
            if (name && email && phone && message) {
                // Show success message
                document.getElementById('responseMessage').style.display = 'block';

                // Reset the form after successful submission
                document.getElementById('yourName').value = '';
                document.getElementById('yourEmail').value = '';
                document.getElementById('yourPhone').value = '';
                document.getElementById('message').value = '';

                // Optionally, hide the success message after a few seconds (e.g., 3 seconds)
                setTimeout(function () {
                    document.getElementById('responseMessage').style.display = 'none';
                }, 3000);  // Hides the success message after 3 seconds
            } else {
                alert('Please fill all fields.');
            }
        }
    </script>
